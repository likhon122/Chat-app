name: Production CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BACKEND_IMAGE_NAME: chat-app-backend
  CLIENT_IMAGE_NAME: chat-app-client

jobs:
  # ============================================================================
  # Stage 1: Quality Gate & Automated Build Validation
  # ============================================================================
  quality-gate:
    name: Code Verification & Bundling
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            client/package-lock.json

      - name: Verify Backend Syntax & Dependencies
        run: |
          echo "Auditing backend source code..."
          cd backend
          npm ci --omit=dev
          find src -name "*.js" -exec node --check {} +
          echo "Backend syntax verification passed."

      - name: Verify Frontend Compilation & Bundle
        run: |
          echo "Building client production assets..."
          cd client
          npm ci
          npm run build
          echo "Frontend compilation passed."

  # ============================================================================
  # Stage 2: Docker Hub Build & Multi-Tag Push
  # ============================================================================
  docker-build-push:
    name: Build & Push Docker Images
    needs: quality-gate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up QEMU (Multi-Architecture Emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ------------------------------------------------------------------------
      # Build & Push Backend
      # ------------------------------------------------------------------------
      - name: Extract Metadata for Backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.BACKEND_IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
            type=sha,format=long

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      # ------------------------------------------------------------------------
      # Build & Push Frontend Client
      # ------------------------------------------------------------------------
      - name: Extract Metadata for Client
        id: meta-client
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.CLIENT_IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
            type=sha,format=long

      - name: Build and Push Client Image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          tags: ${{ steps.meta-client.outputs.tags }}
          labels: ${{ steps.meta-client.outputs.labels }}
          build-args: |
            VITE_SERVER_URL=${{ secrets.VITE_SERVER_URL || '' }}
            VITE_VAPID_PUBLIC_KEY=${{ secrets.VITE_VAPID_PUBLIC_KEY || '' }}
          cache-from: type=gha,scope=client
          cache-to: type=gha,mode=max,scope=client

  # ============================================================================
  # Stage 3: Automated Deployment to Microsoft Azure Web App
  # ============================================================================
  deploy-to-azure:
    name: Continuous Deployment to Azure Web App
    needs: docker-build-push
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'chat-app'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: '${{ secrets.DOCKERHUB_USERNAME }}/${{ env.BACKEND_IMAGE_NAME }}:latest'
