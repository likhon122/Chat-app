name: Production CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BACKEND_IMAGE_NAME: chat-app-backend
  CLIENT_IMAGE_NAME: chat-app-client

jobs:
  # ============================================================================
  # Stage 1: Quality Gate & Automated Build Validation
  # ============================================================================
  quality-gate:
    name: Code Verification & Bundling
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            client/package-lock.json

      - name: Verify Backend Syntax & Dependencies
        run: |
          echo "Auditing backend source code..."
          cd backend
          npm ci --omit=dev
          find src -name "*.js" -exec node --check {} +
          echo "Backend syntax verification passed."

      - name: Verify Frontend Compilation & Bundle
        run: |
          echo "Building client production assets..."
          cd client
          npm ci
          npm run build
          echo "Frontend compilation passed."

  # ============================================================================
  # Stage 2: Docker Hub Build & Multi-Tag Push
  # ============================================================================
  docker-build-push:
    name: Build & Push Docker Images
    needs: quality-gate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up QEMU (Multi-Architecture Emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ------------------------------------------------------------------------
      # Build & Push Backend
      # ------------------------------------------------------------------------
      - name: Extract Metadata for Backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.BACKEND_IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
            type=sha,format=long

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      # ------------------------------------------------------------------------
      # Build & Push Frontend Client
      # ------------------------------------------------------------------------
      - name: Extract Metadata for Client
        id: meta-client
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.CLIENT_IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
            type=sha,format=long

      - name: Build and Push Client Image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          tags: ${{ steps.meta-client.outputs.tags }}
          labels: ${{ steps.meta-client.outputs.labels }}
          build-args: |
            VITE_SERVER_URL=${{ secrets.VITE_SERVER_URL || '' }}
            VITE_VAPID_PUBLIC_KEY=${{ secrets.VITE_VAPID_PUBLIC_KEY || '' }}
          cache-from: type=gha,scope=client
          cache-to: type=gha,mode=max,scope=client

  # ============================================================================
  # Stage 3: Automated Deployment to Microsoft Azure VM
  # ============================================================================
  deploy-to-azure:
    name: Continuous Deployment to Azure VM
    needs: docker-build-push
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Deploy to Azure via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_SSH_KEY }}
          port: ${{ secrets.AZURE_SSH_PORT || 22 }}
          script_stop: true
          envs: DOCKERHUB_USERNAME
          script: |
            set -e
            echo "Starting deployment on Azure Virtual Machine..."

            APP_DIR="/opt/chat-app"
            mkdir -p "$APP_DIR"
            cd "$APP_DIR"

            # Authenticate with Docker Hub on host
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            # Pull latest production docker images
            export DOCKERHUB_USERNAME="${{ secrets.DOCKERHUB_USERNAME }}"
            export IMAGE_TAG="${{ github.sha }}"

            echo "Pulling fresh container images..."
            docker pull "${DOCKERHUB_USERNAME}/chat-app-backend:latest"
            docker pull "${DOCKERHUB_USERNAME}/chat-app-client:latest"

            # Gracefully restart application containers
            echo "Applying rolling container updates..."
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Health check validation
            echo "Validating service health..."
            sleep 10
            docker compose -f docker-compose.prod.yml ps

            # Prune obsolete images to conserve Azure VM disk space
            echo "Pruning dangling images..."
            docker image prune -af --filter "until=72h"

            echo "Deployment completed successfully on Azure!"
