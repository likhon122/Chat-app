# Full-Stack Chat Application - Docker Compose Orchestration
# Services: MongoDB (Database), Backend (Node.js API & Socket.IO), Client (React + Nginx)
name: chat-app

services:
  # MongoDB Database Service
  mongo:
    image: mongo:7.0
    container_name: chat_app_mongodb
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME:-chat_app}
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - chat_network

  # Backend API & WebSocket Service (Node.js + Express + Socket.IO)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chat_app_backend
    restart: unless-stopped
    ports:
      - "${PORT:-7777}:7777"
    depends_on:
      mongo:
        condition: service_healthy
    env_file:
      - ./backend/.env
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:7777/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - chat_network

  # Frontend Client Service (React SPA served by Nginx with reverse proxy)
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_SERVER_URL: ${VITE_SERVER_URL:-http://localhost:7777}
        VITE_VAPID_PUBLIC_KEY: ${VITE_VAPID_PUBLIC_KEY:-}
    container_name: chat_app_client
    restart: unless-stopped
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - chat_network

 
# Bridge Network for Inter-Container Communication
networks:
  chat_network:
    driver: bridge

 
# Persistent Volumes
volumes:
  mongodb_data:
    driver: local
