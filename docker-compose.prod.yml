# ==============================================================================
# Production Docker Compose for Microsoft Azure Virtual Machine Deployment
# Uses pre-built images from Docker Hub for fast, low-overhead zero-downtime updates
# ==============================================================================

name: chat-app-prod

services:
  # ----------------------------------------------------------------------------
  # MongoDB Database Service
  # ----------------------------------------------------------------------------
  mongo:
    image: mongo:7.0
    container_name: chat_app_prod_mongodb
    restart: always
    ports:
      - "127.0.0.1:27017:27017" # Bind to localhost only on production host for security
    volumes:
      - mongodb_prod_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: chat_app
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - chat_prod_network

  # ----------------------------------------------------------------------------
  # Backend API & WebSocket Service (Node.js 20 + Socket.IO)
  # ----------------------------------------------------------------------------
  backend:
    image: ${DOCKERHUB_USERNAME}/chat-app-backend:latest
    container_name: chat_app_prod_backend
    restart: always
    ports:
      - "127.0.0.1:7777:7777" # Exposed to local host and client reverse proxy
    depends_on:
      mongo:
        condition: service_healthy
    env_file:
      - ./backend/.env
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:7777/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - chat_prod_network

  # ----------------------------------------------------------------------------
  # Frontend Client Service (React SPA served by Nginx with API/WebSocket reverse proxy)
  # ----------------------------------------------------------------------------
  client:
    image: ${DOCKERHUB_USERNAME}/chat-app-client:latest
    container_name: chat_app_prod_client
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      # Optional host mounts for SSL certificates and custom Nginx config
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - chat_prod_network

  # ----------------------------------------------------------------------------
  # Certbot Service (Automatic SSL/TLS Certificate Issuance & Renewal)
  # ----------------------------------------------------------------------------
  certbot:
    image: certbot/certbot:latest
    container_name: chat_app_prod_certbot
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - chat_prod_network

networks:
  chat_prod_network:
    driver: bridge

volumes:
  mongodb_prod_data:
    driver: local
